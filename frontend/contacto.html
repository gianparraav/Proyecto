<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contacto | Café Aroma</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="contacto" class="page-static">
    <nav class="navbar"></nav>
    <main class="contact-page">
      <aside>
        <h1>Horario</h1>
        <p><b>Lunes – Viernes</b><span>7:00 – 20:00</span></p>
        <p><b>Sábado</b><span>8:00 – 21:00</span></p>
        <p><b>Domingo</b><span>9:00 – 18:00</span></p>
        <div class="location">
          📍 <b>Ubicación</b><br />Av. Principal 123, Local A<br />Ciudad
          Central, CP 10001<br /><br />📞 +1 (000) 123-4567<br />✉
          hola@cafearoma.com
        </div>
      </aside>
      <section>
        <h1>Contáctanos</h1>
        <form class="contact-form">
          <div class="two-inputs">
            <label>Nombre *<input required placeholder="Tu nombre" /></label
            ><label
              >Email *<input required type="email" placeholder="tu@email.com"
            /></label>
          </div>
          <label
            >Mensaje *<textarea
              required
              placeholder="¿En qué podemos ayudarte?"
            ></textarea></label
          ><button class="btn-primary">Enviar mensaje</button>
        </form>
      </section>
    </main>
    <script src="js/interface.js"></script>
  </body>
</html>
