  <nav class="navbar">
    <div class="nav-logo"><a href="index.html">☕ Café Origen</a></div>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

  <main class="admin-main">
    <header class="admin-header">
      <h1>Panel de <em>pedidos</em></h1>
      <p>Consulta pedidos del día, actualiza su estado (PUT) o cancela (DELETE).</p>
    </header>

    <section class="admin-card admin-card-wide pedidos-panel">
      <div class="pedidos-summary" id="pedidosSummary">
        <!-- tarjetas resumen: pendientes, preparando, listos, entregados -->
      </div>

      <div class="pedidos-controls">
        <div class="pedidos-filters" id="pedidosFilters">
          <!-- botones: Todos, Pendientes, Preparando, Listos, Entregados, Cancelados -->
        </div>
        <div>
          <button type="button" class="btn-secondary" id="btnRecargarPedidos">↻ Actualizar</button>
        </div>
      </div>

      <div id="pedidosLista" class="pedidos-lista"></div>
    </section>
  </main>

  <footer class="footer">
    <p>☕ Café Origen — Tepic, Nayarit, México</p>
